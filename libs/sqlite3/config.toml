# Insty Project Configuration

[project]
name = "@ecx/sqlite3"
version = "3.50.4"
description = "FFI bindings to SQLite 3.50.4 (generated by insbind from sqlite3.h), with the vendored native library -- a complete SQL database engine with no C toolchain required"
authors = ["ecx"]
license = "MIT"
main = "src/sqlite3.ins"
module = "sqlite3"

[compiler]
optimization_level = 0
output_format = "executable"

[paths]
module_search_paths = [".", "src"]
output_dir = ".cloud/objects"

[dependencies]
