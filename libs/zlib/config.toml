# Insty Project Configuration

[project]
name = "@ecx/zlib"
version = "1.3.1"
description = "FFI bindings to zlib 1.3.1 (generated by insbind from zlib.h), with the vendored native library -- no C toolchain or system install required"
authors = ["ecx"]
license = "MIT"
main = "src/zlib.ins"
module = "zlib"

[compiler]
optimization_level = 0
output_format = "executable"

[paths]
module_search_paths = [".", "src"]
output_dir = ".cloud/objects"

[dependencies]
