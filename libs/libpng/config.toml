# Insty Project Configuration

[project]
name = "@ecx/libpng"
version = "1.6.47"
description = "FFI bindings to libpng 1.6.47 (generated by insbind from png.h), with the vendored native library -- PNG image decode/encode with no C toolchain required"
authors = ["ecx"]
license = "MIT"
main = "src/png.ins"
module = "png"

[compiler]
optimization_level = 0
output_format = "executable"

[paths]
module_search_paths = [".", "src"]
output_dir = ".cloud/objects"

[dependencies]
