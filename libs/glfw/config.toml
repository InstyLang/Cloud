# Insty Project Configuration

[project]
name = "@ecx/glfw"
version = "3.4.0"
description = "FFI bindings to GLFW 3.4 (generated by insbind from glfw3.h), with the vendored native library -- windowing, input, OpenGL/Vulkan contexts with no C toolchain required"
authors = ["ecx"]
license = "MIT"
main = "src/glfw.ins"
module = "glfw"

[compiler]
optimization_level = 0
output_format = "executable"

[paths]
module_search_paths = [".", "src"]
output_dir = ".cloud/objects"

[dependencies]
