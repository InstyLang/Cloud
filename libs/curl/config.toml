# Insty Project Configuration

[project]
name = "@ecx/curl"
version = "8.22.0"
description = "FFI bindings to libcurl 8.22.0 (generated by insbind from curl.h) plus a fixed-arity shim for the variadic easy interface, with the vendored native library -- HTTP/HTTPS and 20+ protocols with no C toolchain required"
authors = ["ecx"]
license = "MIT"
main = "src/curl.ins"
module = "curl"

[compiler]
optimization_level = 0
output_format = "executable"

[paths]
module_search_paths = [".", "src"]
output_dir = ".cloud/objects"

[dependencies]
